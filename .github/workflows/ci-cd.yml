name: CI/CD

on:
  push:
    branches: [ "main", "Ver2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilar y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_cobranza_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/saas_cobranza_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SAAS_COBRANZA_SEMILLAS: "false"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Detectar versión de Java del pom.xml
        id: java
        run: echo "version=$(sed -n 's:.*<java.version>\(.*\)</java.version>.*:\1:p' saas-cobranza/pom.xml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: saas-cobranza/pom.xml

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw
        working-directory: ./saas-cobranza

      - name: Verificar que MySQL responde
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mysql.id }} mysqladmin ping -uroot -proot --silent; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió a tiempo"
          exit 1

      - name: Compilar, ejecutar pruebas y empaquetar
        run: ./mvnw -B -ntp verify
        working-directory: ./saas-cobranza

      - name: Resumen de pruebas en el resumen del job
        if: always()
        run: |
          {
            echo "### Resultados de pruebas (backend)"
            echo ""
            echo "| Clase | Pruebas | Fallos | Errores | Omitidas |"
            echo "| --- | --- | --- | --- | --- |"
            for f in saas-cobranza/target/surefire-reports/*.txt; do
              [ -e "$f" ] || continue
              line=$(grep -m1 'Tests run:' "$f" || true)
              [ -n "$line" ] || continue
              name=$(basename "$f" .txt)
              nums=$(echo "$line" | sed -E 's/.*Tests run: ([0-9]+), Failures: ([0-9]+), Errors: ([0-9]+), Skipped: ([0-9]+).*/\1|\2|\3|\4/')
              echo "| $name | $(echo "$nums" | cut -d'|' -f1) | $(echo "$nums" | cut -d'|' -f2) | $(echo "$nums" | cut -d'|' -f3) | $(echo "$nums" | cut -d'|' -f4) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: saas-cobranza/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: saas-cobranza/target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: saas-cobranza-jar
          path: saas-cobranza/target/*.jar
          retention-days: 14
          if-no-files-found: error

  frontend:
    name: Frontend (lint, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-cobranza/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: ./frontend-cobranza

      - name: Lint
        run: npm run lint
        working-directory: ./frontend-cobranza

      - name: Pruebas Jest con cobertura (gate 80%)
        run: npm run test:coverage
        working-directory: ./frontend-cobranza

      - name: Publicar cobertura de Jest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: frontend-cobranza/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build de producción
        run: npm run build
        working-directory: ./frontend-cobranza

      - name: Publicar dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-cobranza/dist/
          retention-days: 14
          if-no-files-found: error

  deploy-test:
    name: Despliegue en entorno de prueba
    needs: [ backend, frontend ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: entorno-prueba

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_cobranza_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/saas_cobranza_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'SAAS_COBRANZA_SECRETO_CI_ENTORNO_PRUEBA_2026_XYZ' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Detectar versión de Java del pom.xml
        id: java
        run: echo "version=$(sed -n 's:.*<java.version>\(.*\)</java.version>.*:\1:p' saas-cobranza/pom.xml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: temurin

      - name: Descargar jar del backend
        uses: actions/download-artifact@v4
        with:
          name: saas-cobranza-jar
          path: saas-cobranza/target

      - name: Descargar dist del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-cobranza/dist

      - name: Verificar que MySQL responde
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mysql.id }} mysqladmin ping -uroot -proot --silent; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió a tiempo"
          exit 1

      - name: Cliente MySQL disponible
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y -q mysql-client
          fi
          mysql --version

      - name: Fase 1 - crear esquema y datos base de empresas
        run: |
          set -euo pipefail
          echo "Arrancando la aplicación una primera vez para crear el esquema..."
          nohup java -jar saas-cobranza/target/*.jar > app-fase1.log 2>&1 &
          echo $! > app.pid

          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/empleados/login \
              -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$code" != "000" ]; then
              echo "API respondiendo (HTTP $code)"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "La API no respondió en la fase 1"
            tail -80 app-fase1.log
            exit 1
          fi

          echo "Insertando empresas base (requeridas por el DataSeeder)..."
          mysql -h 127.0.0.1 -P 3306 -uroot -proot saas_cobranza_db -e "
            INSERT INTO empresas (id_empresa, nombre, rfc, tipo, activo) VALUES
              (1, 'Santander',     'SAN010101XX1', 'BANCO',      1),
              (2, 'Crediplus',     'CRE010101XX2', 'FINANCIERA', 1),
              (3, 'Proteccion MX', 'PRO010101XX3', 'ASEGURADORA', 1);"

          echo "Deteniendo la aplicación..."
          kill "$(cat app.pid)" 2>/dev/null || true
          for i in $(seq 1 30); do
            if ! curl -s -o /dev/null http://localhost:8080/ 2>/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Fase 2 - desplegar con semillas de prueba
        run: |
          set -euo pipefail
          echo "Desplegando la aplicación con datos de prueba..."
          SAAS_COBRANZA_SEMILLAS=true nohup java -jar saas-cobranza/target/*.jar > app.log 2>&1 &
          echo $! > app.pid

          ok=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/empleados/login \
              -H 'Content-Type: application/json' \
              -d '{"usuario":"gestor.s1.01","password":"Operativo123"}' || true)
            if [ "$code" = "200" ]; then
              echo "API desplegada y con usuarios de prueba"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "El login de prueba no respondió 200"
            tail -80 app.log
            exit 1
          fi

      - name: Servir el frontend (SPA) en el puerto 5173
        run: |
          set -euo pipefail
          nohup python3 -m http.server 5173 --directory frontend-cobranza/dist > web.log 2>&1 &
          echo $! > web.pid
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$code" = "200" ]; then
              echo "Frontend disponible en http://localhost:5173"
              exit 0
            fi
            sleep 1
          done
          echo "El frontend no respondió"
          exit 1

      - name: Smoke tests del entorno de prueba
        run: |
          set -euo pipefail
          fallo() { echo "::error::$1"; exit 1; }

          # 1. La SPA responde y entrega el index
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://localhost:5173/)
          [ "$code" = "200" ] || fallo "Frontend devolvió HTTP $code (se esperaba 200)"
          grep -q 'id="root"' /tmp/index.html || fallo "El index no contiene el contenedor de la SPA"

          # 2. La API exige token (seguridad activa)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tipos-promesa)
          [ "$code" = "401" ] || fallo "Sin token se esperaba 401, llegó $code"

          # 3. Login de gestor con credenciales de prueba
          resp=$(curl -s -X POST http://localhost:8080/api/empleados/login \
            -H 'Content-Type: application/json' \
            -d '{"usuario":"gestor.s1.01","password":"Operativo123"}')
          token=$(echo "$resp" | jq -r '.token // empty')
          [ -n "$token" ] && [ "$token" != "null" ] || fallo "Login de gestor falló: $resp"
          rol=$(echo "$resp" | jq -r '.rol // empty')
          [ "$rol" = "GESTOR" ] || fallo "Se esperaba rol GESTOR, llegó: $rol"
          echo "Login de gestor OK (rol $rol)"

          # 4. Petición autenticada
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" http://localhost:8080/api/tipos-promesa)
          [ "$code" = "200" ] || fallo "Con token se esperaba 200, llegó $code"

          # 5. Login de supervisor (segundo rol de prueba)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/empleados/login \
            -H 'Content-Type: application/json' \
            -d '{"usuario":"supervisor.s1","password":"Operativo123"}')
          [ "$code" = "200" ] || fallo "Login de supervisor devolvió $code (se esperaba 200)"

          # 6. Credenciales inválidas rechazadas
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/empleados/login \
            -H 'Content-Type: application/json' \
            -d '{"usuario":"gestor.s1.01","password":"incorrecta"}')
          [ "$code" = "401" ] || fallo "Contraseña mala se esperaba 401, llegó $code"

          echo "Smoke tests: 6/6 correctos"

      - name: Escaneo de Seguridad con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:5173
          fail_action: false
          allow_issue_writing: false

      - name: Publicar reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: "**/report.html"
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar logs del entorno de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entorno-prueba-logs
          path: |
            app.log
            web.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "### Entorno de prueba (efímero, vivo durante este job)"
            echo ""
            echo "| Servicio | URL |"
            echo "| --- | --- |"
            echo "| Frontend (SPA) | http://localhost:5173 |"
            echo "| API backend | http://localhost:8080/api |"
            echo ""
            echo "**Usuarios de prueba** (semillas de desarrollo, no son secretos):"
            echo ""
            echo "| Usuario | Contraseña | Rol |"
            echo "| --- | --- | --- |"
            echo "| gestor.s1.01 | Operativo123 | GESTOR |"
            echo "| supervisor.s1 | Operativo123 | SUPERVISOR |"
            echo ""
            echo "Despliegue hecho con el artefacto \`saas-cobranza-jar\` y \`frontend-dist\` de esta misma ejecución."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detener el entorno de prueba
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; fi
          if [ -f web.pid ]; then kill "$(cat web.pid)" 2>/dev/null || true; fi
