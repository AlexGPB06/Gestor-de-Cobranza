name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-cobranza/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend-cobranza
        run: npm ci --ignore-scripts
      - name: Apuntar al backend de EC2
        working-directory: frontend-cobranza
        run: sed -i 's|__API_URL__|https://54-156-249-149.nip.io|g' index.html
      - name: Compilar
        working-directory: frontend-cobranza
        run: npm run build -- --base=/Gestor-de-Cobranza/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-cobranza/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
