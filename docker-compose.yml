services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Password123}
      MYSQL_DATABASE: saas_cobranza_db
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/saas_cobranza_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Password123}
      SAAS_COBRANZA_SEMILLAS: "true"
      JWT_SECRET: ${JWT_SECRET:-SECRETO_DEMO_GESTOR_COBRANZA_2026_AWS_12345}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: always
    profiles: ["aws"]
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  mysql-data:
  caddy_data:
  caddy_config:
